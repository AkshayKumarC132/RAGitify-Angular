<section class="auth">
  <div class="auth__card">
    <header class="auth__card-header">
      <h1 class="auth__brand">RAGitify</h1>
      <p class="auth__subtitle">Create your account</p>
    </header>

    <form class="auth__form" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="auth__field-grid">
        <div class="auth__field-group">
          <label class="auth__label" for="first_name">First Name</label>
          <input
            class="auth__input"
            id="first_name"
            type="text"
            formControlName="first_name"
            placeholder="John"
          />
        </div>
        <div class="auth__field-group">
          <label class="auth__label" for="last_name">Last Name</label>
          <input
            class="auth__input"
            id="last_name"
            type="text"
            formControlName="last_name"
            placeholder="Doe"
          />
        </div>
      </div>

      <div class="auth__field-group">
        <label class="auth__label" for="email">Email address *</label>
        <input
          class="auth__input"
          id="email"
          type="email"
          formControlName="email"
          placeholder="john@example.com"
          [class.auth__input--invalid]="email?.invalid && email?.touched"
        />
        <p *ngIf="email?.invalid && email?.touched" class="auth__error">
          Please enter a valid email address
        </p>
      </div>

      <div class="auth__field-group">
        <label class="auth__label" for="password">Password *</label>
        <input
          class="auth__input"
          id="password"
          type="password"
          formControlName="password"
          placeholder="Min. 6 characters"
          [class.auth__input--invalid]="password?.invalid && password?.touched"
        />
        <p *ngIf="password?.invalid && password?.touched" class="auth__error">
          Password must be at least 6 characters
        </p>
      </div>

      <div class="auth__field-group">
        <label class="auth__label" for="tenant_name">Tenant Name *</label>
        <input
          class="auth__input"
          id="tenant_name"
          type="text"
          formControlName="tenant_name"
          placeholder="Your organization name"
          [class.auth__input--invalid]="tenant_name?.invalid && tenant_name?.touched"
        />
        <p *ngIf="tenant_name?.invalid && tenant_name?.touched" class="auth__error">
          Tenant name is required
        </p>
      </div>

      <div class="auth__field-group">
        <label class="auth__label" for="collection_name">Collection Name</label>
        <input
          class="auth__input"
          id="collection_name"
          type="text"
          formControlName="collection_name"
          placeholder="default_collection"
        />
      </div>

      <div *ngIf="errorMessage" class="auth__alert auth__alert--error">
        <p>{{ errorMessage }}</p>
      </div>

      <div *ngIf="successMessage" class="auth__alert auth__alert--success">
        <p>{{ successMessage }}</p>
      </div>

      <button class="auth__submit" type="submit" [disabled]="registerForm.invalid || isLoading">
        <span *ngIf="!isLoading">Create Account</span>
        <span *ngIf="isLoading" class="auth__loading">
          <svg class="auth__spinner" viewBox="0 0 50 50">
            <circle class="auth__spinner-track" cx="25" cy="25" r="20"></circle>
            <circle class="auth__spinner-indicator" cx="25" cy="25" r="20"></circle>
          </svg>
          Creating Account...
        </span>
      </button>

      <p class="auth__helper-text">
        Already have an account?
        <a class="auth__link" routerLink="/login">Sign in</a>
      </p>
    </form>
  </div>
</section>
