<div class="flex h-screen bg-gray-50">
  <!-- Sidebar -->
  <aside 
    [class.w-64]="isSidebarOpen" 
    [class.w-20]="!isSidebarOpen"
    class="bg-gray-900 text-white transition-all duration-300 ease-in-out flex flex-col"
  >
    <!-- Logo and Toggle -->
    <div class="p-4 flex items-center justify-between border-b border-gray-700">
      <h1 *ngIf="isSidebarOpen" class="text-xl font-bold">RAGitify</h1>
      <button 
        (click)="toggleSidebar()" 
        class="p-2 rounded-lg hover:bg-gray-800 transition-colors"
        [attr.aria-label]="isSidebarOpen ? 'Collapse sidebar' : 'Expand sidebar'"
      >
        <svg *ngIf="isSidebarOpen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path>
        </svg>
        <svg *ngIf="!isSidebarOpen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path>
        </svg>
      </button>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
      <a 
        routerLink="/dashboard/chat" 
        routerLinkActive="bg-indigo-600"
        class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-800 transition-colors"
        [class.justify-center]="!isSidebarOpen"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
        </svg>
        <span *ngIf="isSidebarOpen">Chat</span>
      </a>

      <a 
        routerLink="/dashboard/documents" 
        routerLinkActive="bg-indigo-600"
        class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-800 transition-colors"
        [class.justify-center]="!isSidebarOpen"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        <span *ngIf="isSidebarOpen">Documents</span>
      </a>

      <a 
        routerLink="/dashboard/vector-stores" 
        routerLinkActive="bg-indigo-600"
        class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-800 transition-colors"
        [class.justify-center]="!isSidebarOpen"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
        </svg>
        <span *ngIf="isSidebarOpen">Vector Stores</span>
      </a>

      <a 
        routerLink="/dashboard/assistants" 
        routerLinkActive="bg-indigo-600"
        class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-800 transition-colors"
        [class.justify-center]="!isSidebarOpen"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
        </svg>
        <span *ngIf="isSidebarOpen">Assistants</span>
      </a>

      <a 
        routerLink="/dashboard/settings" 
        routerLinkActive="bg-indigo-600"
        class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-800 transition-colors"
        [class.justify-center]="!isSidebarOpen"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
        <span *ngIf="isSidebarOpen">Settings</span>
      </a>
    </nav>

    <!-- User Profile -->
    <div class="p-4 border-t border-gray-700">
      <div class="flex items-center space-x-3" [class.justify-center]="!isSidebarOpen">
        <div class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center font-semibold">
          {{ (user?.email?.charAt(0) ?? 'U').toUpperCase() }}
        </div>
        <div *ngIf="isSidebarOpen" class="flex-1 min-w-0">
          <p class="text-sm font-medium truncate">{{ user?.email }}</p>
          <button 
            (click)="logout()" 
            class="text-xs text-gray-400 hover:text-white transition-colors"
          >
            Logout
          </button>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-hidden">
    <router-outlet></router-outlet>
  </main>
</div>
