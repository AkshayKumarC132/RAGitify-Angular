<div class="dashboard" [class.dashboard--sidebar-collapsed]="!isSidebarOpen">
  <aside class="dashboard__sidebar" [class.dashboard__sidebar--collapsed]="!isSidebarOpen">
    <div class="dashboard__brand-row">
      <h1 *ngIf="isSidebarOpen" class="dashboard__brand">RAGitify</h1>
      <button
        type="button"
        class="dashboard__toggle"
        (click)="toggleSidebar()"
        [attr.aria-label]="isSidebarOpen ? 'Collapse sidebar' : 'Expand sidebar'"
      >
        <span class="dashboard__toggle-icon" [class.dashboard__toggle-icon--collapsed]="!isSidebarOpen"></span>
      </button>
    </div>

    <nav class="dashboard__nav">
      <a
        class="dashboard__nav-item"
        routerLink="/dashboard/chat"
        routerLinkActive="dashboard__nav-item--active"
        [class.dashboard__nav-item--icon-only]="!isSidebarOpen"
      >
        <span class="dashboard__nav-icon">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 4c-4.97 0-9 3.13-9 7s4.03 7 9 7c1.51 0 2.95-.27 4.24-.76L21 20l-1.49-3.66C20.45 14.45 21 13.27 21 12c0-3.87-4.03-7-9-7Zm-4 8.5a.5.5 0 1 1 0-1 .5.5 0 0 1 0 1Zm4 0a.5.5 0 1 1 0-1 .5.5 0 0 1 0 1Zm4 0a.5.5 0 1 1 0-1 .5.5 0 0 1 0 1Z"
              fill="currentColor"
            />
          </svg>
        </span>
        <span class="dashboard__nav-label" *ngIf="isSidebarOpen">Chat</span>
      </a>

      <a
        class="dashboard__nav-item"
        routerLink="/dashboard/documents"
        routerLinkActive="dashboard__nav-item--active"
        [class.dashboard__nav-item--icon-only]="!isSidebarOpen"
      >
        <span class="dashboard__nav-icon">
          <svg viewBox="0 0 24 24">
            <path
              d="M14 2H7a2 2 0 0 0-2 2v16a1 1 0 0 0 1.447.895L12 18.618l5.553 2.277A1 1 0 0 0 19 20V8.414a2 2 0 0 0-.586-1.414l-3.414-3.414A2 2 0 0 0 14 2Z"
              fill="currentColor"
            />
          </svg>
        </span>
        <span class="dashboard__nav-label" *ngIf="isSidebarOpen">Documents</span>
      </a>

      <a
        class="dashboard__nav-item"
        routerLink="/dashboard/vector-stores"
        routerLinkActive="dashboard__nav-item--active"
        [class.dashboard__nav-item--icon-only]="!isSidebarOpen"
      >
        <span class="dashboard__nav-icon">
          <svg viewBox="0 0 24 24">
            <path
              d="M19 11H5a2 2 0 0 0-2 2v6c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2Zm0-2V7a2 2 0 0 0-2-2h-3V3a2 2 0 0 0-2-2H9a2 2 0 0 0-2 2v2H4a2 2 0 0 0-2 2v2h17Z"
              fill="currentColor"
            />
          </svg>
        </span>
        <span class="dashboard__nav-label" *ngIf="isSidebarOpen">Vector Stores</span>
      </a>

      <a
        class="dashboard__nav-item"
        routerLink="/dashboard/assistants"
        routerLinkActive="dashboard__nav-item--active"
        [class.dashboard__nav-item--icon-only]="!isSidebarOpen"
      >
        <span class="dashboard__nav-icon">
          <svg viewBox="0 0 24 24">
            <path
              d="M20 4H4a2 2 0 0 0-2 2v7c0 1.105.895 2 2 2h1.172a3 3 0 0 1 2.122.879L9 20h6l1.707-4.121A3 3 0 0 1 18.828 13H20a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Z"
              fill="currentColor"
            />
          </svg>
        </span>
        <span class="dashboard__nav-label" *ngIf="isSidebarOpen">Assistants</span>
      </a>

      <a
        class="dashboard__nav-item"
        routerLink="/dashboard/settings"
        routerLinkActive="dashboard__nav-item--active"
        [class.dashboard__nav-item--icon-only]="!isSidebarOpen"
      >
        <span class="dashboard__nav-icon">
          <svg viewBox="0 0 24 24">
            <path
              d="M19.14 12.936a7.958 7.958 0 0 0 .063-.936 7.958 7.958 0 0 0-.063-.936l2.036-1.59a.5.5 0 0 0 .122-.642l-1.928-3.338a.5.5 0 0 0-.607-.228l-2.397.96a7.99 7.99 0 0 0-1.62-.936l-.364-2.544A.5.5 0 0 0 13.912 2h-3.824a.5.5 0 0 0-.495.42l-.364 2.544a7.99 7.99 0 0 0-1.62.936l-2.397-.96a.5.5 0 0 0-.607.228L2.677 8.506a.5.5 0 0 0 .122.642l2.036 1.59a7.958 7.958 0 0 0-.063.936c0 .316.022.626.063.936l-2.036 1.59a.5.5 0 0 0-.122.642l1.928 3.338a.5.5 0 0 0 .607.228l2.397-.96c.5.39 1.04.714 1.62.936l.364 2.544a.5.5 0 0 0 .495.42h3.824a.5.5 0 0 0 .495-.42l.364-2.544c.58-.222 1.12-.546 1.62-.936l2.397.96a.5.5 0 0 0 .607-.228l1.928-3.338a.5.5 0 0 0-.122-.642l-2.036-1.59ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"
              fill="currentColor"
            />
          </svg>
        </span>
        <span class="dashboard__nav-label" *ngIf="isSidebarOpen">Settings</span>
      </a>
    </nav>

    <footer class="dashboard__profile" [class.dashboard__profile--centered]="!isSidebarOpen">
      <div class="dashboard__avatar">
        {{ (user?.email?.charAt(0) ?? 'U').toUpperCase() }}
      </div>
      <div *ngIf="isSidebarOpen" class="dashboard__profile-info">
        <p class="dashboard__profile-name">{{ user?.email }}</p>
        <button type="button" class="dashboard__signout" (click)="logout()">Logout</button>
      </div>
    </footer>
  </aside>

  <main class="dashboard__content">
    <router-outlet></router-outlet>
  </main>
</div>
